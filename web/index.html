<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文档检索</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">文档检索</div>
    <nav class="tabs" id="tabs">
      <button type="button" data-view="search" class="on">检索</button>
      <button type="button" data-view="library">文件库 <span id="docCount" class="count">0</span><span id="busyCount" class="busy-count" hidden></span></button>
    </nav>
    <div class="health" id="health" title="服务状态"></div>
  </header>

  <main class="layout" id="viewSearch">
    <aside class="search-pane">
      <form id="searchForm" class="search-box">
        <div class="q-wrap">
          <input id="q" type="search" placeholder="在全部文件的正文和文件名里查找，如：项目编号、质保期" autocomplete="off" autofocus>
          <button type="button" class="q-clear" id="qClear" title="清除搜索（Esc）" hidden>×</button>
          <div class="history" id="history" hidden></div>
        </div>
        <button class="btn primary" type="submit">检索</button>
      </form>
      <div class="meta" id="meta"></div>
      <ol class="results" id="results"></ol>
    </aside>

    <section class="viewer-pane">
      <div class="viewer-bar" id="viewerBar" hidden>
        <span class="viewer-title" id="viewerTitle"></span>
        <span class="viewer-note" id="viewerNote" hidden></span>
        <span class="hit-nav" id="hitNav" hidden>
          <button class="btn small" id="prevHit" title="上一处（Shift+F3）">‹ 上一处</button>
          <span id="hitPos"></span>
          <button class="btn small" id="nextHit" title="下一处（F3）">下一处 ›</button>
        </span>
        <span class="viewer-page" id="viewerPage"></span>
        <a class="btn small" id="downloadOrig" href="#" download>下载原文</a>
      </div>
      <div class="pages" id="pages">
        <div class="empty"><p>点击左侧检索结果，在这里查看原文并定位关键字</p></div>
      </div>
    </section>
  </main>

  <main class="library" id="viewLibrary" hidden>
    <div class="lib-top">
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.rtf" hidden>
        <strong>上传文件：点击选择，或把文件拖到这里</strong>
        <span>支持 PDF、Word（doc/docx）、RTF，可多选；扫描件会自动 OCR</span>
      </label>
      <div class="upload-panel" id="uploadPanel" hidden>
        <div class="upload-line"><span id="uploadText"></span><span id="uploadPct"></span></div>
        <div class="bar"><i id="uploadBar"></i></div>
      </div>
      <div class="notices" id="notices"></div>
    </div>

    <div class="lib-toolbar">
      <div class="chips" id="statusFilter"></div>
      <input id="libQ" class="lib-q" type="search" placeholder="按文件名筛选" autocomplete="off">
      <button class="btn small" id="reindexAll" title="改了行业词典、升级了解析程序后使用">全部重新解析</button>
    </div>

    <div class="sel-bar" id="selBar" hidden>
      <span id="selText"></span>
      <button class="link" id="selAll" hidden></button>
      <span class="spacer"></span>
      <button class="btn small" id="selReindex">重新解析</button>
      <button class="btn small danger" id="selDelete">删除</button>
      <button class="btn small" id="selClear">取消选择</button>
    </div>

    <div class="lib-table-wrap">
      <table class="lib-table">
        <thead><tr>
          <th class="check"><input type="checkbox" id="selPage" title="选中本页"></th>
          <th>文件名</th><th class="num">大小</th><th class="num">页数</th><th>状态</th><th>进度 / 结果</th>
          <th>上传时间</th><th>完成时间</th><th class="num">耗时</th><th></th>
        </tr></thead>
        <tbody id="docRows"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </main>

  <div class="drop-overlay" id="dropOverlay">松开即可上传</div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
